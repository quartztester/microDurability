pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		gradlePluginPortal()
		mavenCentral()
	}
	plugins {
		id 'net.fabricmc.fabric-loom-remap' version '1.18.0-alpha.16'
		id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.16'
		id 'com.diffplug.spotless' version "${spotless_version}"
	}
}

rootProject.name = 'microdurability'

include 'microdurability-core'
include 'microdurability-1.16'
include 'microdurability-1.17'
include 'microdurability-1.19'
include 'microdurability-1.19.4'
include 'microdurability-1.20'
include 'microdurability-1.20.5'
include 'microdurability-1.21'
include 'microdurability-26.2'
include 'microdurability-26.2-render-test'
include 'microdurability-dev-env-extras'
